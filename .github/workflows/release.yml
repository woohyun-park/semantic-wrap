name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create release app token
        id: release-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm version that supports trusted publishing
        run: npm install --global npm@11
      - run: bun install --frozen-lockfile
      - name: Create version pull request or publish packages
        uses: changesets/action@v2
        id: changesets
        with:
          version-script: bun run version:packages
          publish-script: bun run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          create-github-releases: false
          push-git-tags: true
          github-token: ${{ steps.release-app.outputs.token }}
      - name: Create unified GitHub Release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          version="$(node -e 'const packages = JSON.parse(process.env.PUBLISHED_PACKAGES); const versions = [...new Set(packages.map((item) => item.version))]; if (versions.length !== 1) process.exit(1); process.stdout.write(versions[0]);')"
          gh release create "v${version}" --target "$GITHUB_SHA" --generate-notes --latest
      - name: Verify npm, git, and GitHub release synchronization
        if: steps.changesets.outputs.has-changesets != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.changesets.outputs.published == 'true' && github.sha || '' }}
        run: bun run release:verify --remote

name: Release

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Detect unreleased changesets
        id: changesets
        shell: bash
        run: |
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: changesets/action/version@v2
        id: version
        if: steps.changesets.outputs.present == 'true'
        with:
          script: bun run version:packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
      - name: Run CI for version pull request
        if: steps.changesets.outputs.present == 'true' && steps.version.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_PR: ${{ steps.version.outputs.pr-number }}
        run: |
          changeset_ref="$(gh pr view "$VERSION_PR" --json headRefName --jq .headRefName)"
          gh workflow run ci.yml --ref "$changeset_ref"
